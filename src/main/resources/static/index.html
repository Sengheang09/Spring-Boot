<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Employee Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
          font-family: Inter, system-ui, sans-serif;
          background: #f4f6fb;
        }

        .card {
          border: none;
          border-radius: 18px;
          box-shadow: 0 10px 25px rgba(0,0,0,.05);
        }

        .header {
          font-weight: 700;
        }

        .badge-soft {
          background: #eef2ff;
          color: #4f46e5;
          font-weight: 500;
        }

        .table th {
          font-size: 0.85rem;
          text-transform: uppercase;
          color: #6b7280;
        }

        .table td {
          vertical-align: middle;
        }

        .skeleton {
          height: 18px;
          background: linear-gradient(90deg,#eee,#f5f5f5,#eee);
          animation: shimmer 1.2s infinite;
          border-radius: 8px;
        }

        @keyframes shimmer {
          0% {background-position:-200px}
          100% {background-position:200px}
        }
    </style>
</head>

<body class="p-4">

<div class="container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="header mb-1">Employee Dashboard</h2>
            <div class="text-muted">Manage company employees</div>
        </div>
        <span class="badge badge-soft">Spring Boot + JPA</span>
    </div>

    <div class="row g-4">
        <!-- Form -->
        <div class="col-lg-4">
            <div class="card p-4">
                <h5 class="mb-3">Add Employee</h5>

                <form id="form">
                    <input class="form-control mb-2" placeholder="Name" required name="name">
                    <input class="form-control mb-2" placeholder="Email" required name="email">
                    <input class="form-control mb-2" placeholder="Gender" name="gender">
                    <input class="form-control mb-2" placeholder="Position" name="position">
                    <input class="form-control mb-3" placeholder="Salary" type="number" step="0.01" name="salary">

                    <button class="btn btn-primary w-100">Create Employee</button>
                </form>
            </div>
        </div>

        <!-- Table -->
        <div class="col-lg-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="mb-0">Employees</h5>
                    <input id="search" class="form-control w-50" placeholder="Search...">
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th>
                            <th>Position</th><th>Salary</th>
                        </tr>
                        </thead>
                        <tbody id="tbody">
                        <tr><td colspan="5"><div class="skeleton"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="toast" class="toast align-items-center text-bg-primary border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button class="btn-close btn-close-white me-2" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8080/api/employee";
    const tbody = document.getElementById("tbody");
    const form = document.getElementById("form");
    const search = document.getElementById("search");

    let employees = [];

    function toast(msg, type="primary") {
      const t = document.getElementById("toast");
      t.className = `toast align-items-center text-bg-${type}`;
      document.getElementById("toastMsg").innerText = msg;
      new bootstrap.Toast(t).show();
    }

    async function load() {
      const res = await fetch(API);
      if (res.status === 204) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-muted">No employees</td></tr>`;
        return;
      }
      const json = await res.json();
      employees = json.data || [];
      render(employees);
    }

    function render(list) {
      tbody.innerHTML = list.map(e => `
        <tr>
          <td>${e.id}</td>
          <td><strong>${e.name}</strong></td>
          <td>${e.email}</td>
          <td>${e.position || "-"}</td>
          <td>$${Number(e.salary || 0).toFixed(2)}</td>
        </tr>
      `).join("");
    }

    form.onsubmit = async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.salary = data.salary ? Number(data.salary) : null;

      const res = await fetch(API, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
      });

      if (res.status === 409) {
        toast("Email already exists","warning");
        return;
      }

      toast("Employee created","success");
      form.reset();
      load();
    };

    search.oninput = () => {
      const q = search.value.toLowerCase();
      render(employees.filter(e =>
        e.name.toLowerCase().includes(q) ||
        e.email.toLowerCase().includes(q)
      ));
    };

    load();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
